# Maintenance mode: version-update PRs are off (limit 0). Security updates still
# arrive through Dependabot security updates, enabled in repository settings.
# The repo has no package dependencies; the only pinned third-party code is the
# GitHub Actions in .github/workflows/, pinned to full commit SHAs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
